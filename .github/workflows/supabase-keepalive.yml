name: Supabase Keepalive

on:
  schedule:
    # Twice a week (Mon & Thu 05:00 UTC) so a delayed/skipped run doesn't
    # let the project cross Supabase's 7-day inactivity pause threshold.
    - cron: '0 5 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Unexpected status code from Supabase: $status"
            exit 1
          fi
